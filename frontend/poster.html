<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KodiPay Christmas Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Poppins', sans-serif;
        }

        .poster-container {
            width: 800px;
            height: 1000px;
            background: linear-gradient(135deg, #1A237E 0%, #0d1245 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            border: 20px solid #FFA000;
        }

        /* Decorative Elements */
        .snowflake {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            font-size: 2rem;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(1000px) rotate(360deg);
                opacity: 0;
            }
        }

        .ornament {
            position: absolute;
            top: -20px;
            width: 4px;
            height: 100px;
            background-color: #FFA000;
        }

        .ornament::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: -13px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #FFD54F, #FFA000);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 160, 0, 0.5);
        }

        /* Content */
        .logo-container {
            background-color: white;
            padding: 20px;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        .logo-container img {
            width: 100px;
            height: auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            margin: 0;
            line-height: 1.1;
            color: #FFA000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin: 10px 0 30px;
            font-weight: 400;
            font-style: italic;
            z-index: 10;
        }

        p {
            font-size: 1.5rem;
            max-width: 80%;
            line-height: 1.6;
            opacity: 0.9;
            z-index: 10;
        }

        .footer {
            margin-top: 60px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #FFA000;
            z-index: 10;
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }
    </style>
</head>

<body>

    <div class="poster-container">
        <!-- Snowflakes -->
        <div class="snowflake" style="left: 10%; animation-duration: 10s; animation-delay: 0s;">❄</div>
        <div class="snowflake" style="left: 30%; animation-duration: 12s; animation-delay: 2s;">❅</div>
        <div class="snowflake" style="left: 50%; animation-duration: 8s; animation-delay: 4s;">❆</div>
        <div class="snowflake" style="left: 70%; animation-duration: 15s; animation-delay: 1s;">❄</div>
        <div class="snowflake" style="left: 90%; animation-duration: 11s; animation-delay: 3s;">❅</div>

        <!-- Ornaments -->
        <div class="ornament" style="left: 15%; height: 150px;"></div>
        <div class="ornament" style="left: 85%; height: 120px;"></div>
        <div class="ornament" style="left: 50%; height: 80px;"></div>

        <!-- Sparkles -->
        <div class="sparkle" style="top: 20%; left: 20%;"></div>
        <div class="sparkle" style="top: 60%; left: 80%;"></div>
        <div class="sparkle" style="top: 80%; left: 15%;"></div>
        <div class="sparkle" style="top: 30%; left: 70%;"></div>

        <div class="logo-container">
            <!-- Assuming the logo is in assets/icon/icon.png relative to the frontend folder -->
            <img src="assets/icon/icon.png" alt="KodiPay Logo">
        </div>

        <h1>Merry<br>Christmas</h1>
        <h2>& Happy New Year</h2>

        <p>Wishing you joy, prosperity, and a wonderful holiday season.</p>

        <div class="footer">From the KodiPay Team</div>
    </div>

</body>

</html>
